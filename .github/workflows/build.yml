name: Build VSIX

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version"

    - name: Patch VSIX manifest version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $manifest = "SwitchStartupProject\source.extension.vsixmanifest"
        $content = Get-Content $manifest -Raw
        $content = $content -replace '(<Identity[^>]+Version=")[0-9]+\.[0-9]+\.[0-9]+(")', "`${1}${{ steps.version.outputs.VERSION }}`$2"
        Set-Content $manifest $content
        Write-Host "Patched manifest to version ${{ steps.version.outputs.VERSION }}"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore SwitchStartupProject.sln -Verbosity quiet

    - name: Build VSIX
      run: msbuild SwitchStartupProject.sln /p:Configuration=Release /p:DeployExtension=false /p:ZipPackageCompressionLevel=normal /v:m

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartStartupProjectSwitcher-VSIX
        path: SwitchStartupProject\bin\Release\*.vsix

    - name: Publish to Visual Studio Marketplace
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $VsixPublisher = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -find **\VsixPublisher.exe | Select-Object -First 1
        & $VsixPublisher publish -payload "SwitchStartupProject\bin\Release\SmartStartupProjectSwitcher.vsix" -publishManifest "publishManifest.json" -personalAccessToken "${{ secrets.VS_MARKETPLACE_PAT }}"
